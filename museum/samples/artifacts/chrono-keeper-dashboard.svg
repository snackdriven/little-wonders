<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Faded ChronoKeeper dashboard screenshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2620"/><stop offset="1" stop-color="#1c1814"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- window chrome -->
  <rect x="0" y="0" width="640" height="34" fill="#332d25"/>
  <circle cx="20" cy="17" r="5" fill="#9b3b32"/><circle cx="40" cy="17" r="5" fill="#c4862f"/><circle cx="60" cy="17" r="5" fill="#7d7058"/>
  <rect x="220" y="10" width="200" height="14" rx="7" fill="#241f1a"/>
  <!-- sidebar -->
  <rect x="0" y="34" width="150" height="366" fill="#26211b"/>
  <rect x="20" y="60" width="110" height="10" rx="5" fill="#3f372d"/>
  <rect x="20" y="84" width="90" height="8" rx="4" fill="#352e26"/>
  <rect x="20" y="104" width="100" height="8" rx="4" fill="#352e26"/>
  <rect x="20" y="124" width="70" height="8" rx="4" fill="#352e26"/>
  <rect x="14" y="150" width="122" height="26" rx="4" fill="#3a322a"/>
  <!-- main: a chart that never had data -->
  <rect x="178" y="60" width="180" height="12" rx="6" fill="#4a4034"/>
  <rect x="178" y="92" width="436" height="150" rx="6" fill="#211c17" stroke="#3a322a"/>
  <polyline points="200,210 260,190 320,200 380,150 440,170 500,120 560,140" fill="none" stroke="#c9a24b" stroke-width="2" opacity="0.55"/>
  <line x1="200" y1="232" x2="592" y2="232" stroke="#3a322a"/>
  <!-- cards with no numbers -->
  <rect x="178" y="262" width="138" height="100" rx="6" fill="#241f1a" stroke="#3a322a"/>
  <rect x="328" y="262" width="138" height="100" rx="6" fill="#241f1a" stroke="#3a322a"/>
  <rect x="478" y="262" width="136" height="100" rx="6" fill="#241f1a" stroke="#3a322a"/>
  <rect x="196" y="282" width="60" height="22" rx="4" fill="#3f372d"/>
  <rect x="196" y="316" width="100" height="8" rx="4" fill="#2f2922"/>
  <rect x="346" y="282" width="60" height="22" rx="4" fill="#3f372d"/>
  <rect x="496" y="282" width="60" height="22" rx="4" fill="#3f372d"/>
  <!-- a "loading" that never resolved -->
  <text x="396" y="170" font-family="monospace" font-size="11" fill="#7d7058" text-anchor="middle">loading streaks…</text>
  <!-- faded scanline overlay -->
  <rect width="640" height="400" fill="#000" opacity="0.06"/>
</svg>
